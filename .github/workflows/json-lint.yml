---
on:
  workflow_call:

jobs:
  json-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect JSON changes
        id: changed-files
        uses: dorny/paths-filter@v4
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            json:
              - added|modified: '**/*.[jJ][sS][oO][nN]'
      - name: Set up Python
        if: steps.changed-files.outputs.json == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run JSON Linter
        if: steps.changed-files.outputs.json == 'true'
        run: |
          python -m pip install --no-cache-dir demjson3==3.0.6
          find . -type f -iname "*.json" -exec jsonlint \{\} \+
