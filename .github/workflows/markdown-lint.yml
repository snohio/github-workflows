---
on:
  workflow_call:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect Markdown changes
        id: changed-files
        uses: dorny/paths-filter@v4
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            markdown:
              - added|modified: '**/*.[mM][dD]'
      - name: Set up Ruby
        if: steps.changed-files.outputs.markdown == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Run Markdown Linter
        if: steps.changed-files.outputs.markdown == 'true'
        run: |
          gem install mdl --version 0.18.1 --no-document
          find . -type f -iname "*.md" -exec mdl \{\} \+
