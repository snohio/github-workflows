---
on:
  workflow_call:

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect YAML changes
        id: changed-files
        uses: dorny/paths-filter@v4
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            yaml:
              - added|modified:
                  - '**/*.[yY][mM][lL]'
                  - '**/*.[yY][aA][mM][lL]'
      - name: Set up Ruby
        if: steps.changed-files.outputs.yaml == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Run Yaml Linter
        if: steps.changed-files.outputs.yaml == 'true'
        run: |
          gem install yaml-lint --version 0.1.2 --no-document
          find . -type f -iname "*.yml" -exec yaml-lint -n \{\} \+
          find . -type f -iname "*.yaml" -exec yaml-lint -n \{\} \+
