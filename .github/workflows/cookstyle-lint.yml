---
on:
  workflow_call:

jobs:
  cookstyle-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect Ruby changes
        id: changed-files
        uses: dorny/paths-filter@v4
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            ruby:
              - added|modified: '**/*.[rR][bB]'
      - name: Set up Ruby
        if: steps.changed-files.outputs.ruby == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Run Cookstyle Linter
        if: steps.changed-files.outputs.ruby == 'true'
        run: |
          gem install cookstyle --version 9.0.9 --no-document
          cookstyle --display-cop-names --extra-details --display-style-guide
